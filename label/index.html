<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a08">
<link rel="manifest" href="manifest.json">
<title>DROP 商品登録</title>
<style>
  :root { --bg:#0c0a08; --panel:#16120d; --line:rgba(240,236,227,.12); --gold:#c9a961; --tx:#f0ece3; --sub:rgba(240,236,227,.55); --red:#e04434; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--tx); font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif; -webkit-font-smoothing:antialiased; padding:16px; max-width:860px; margin:0 auto; }
  h1 { font-size:18px; letter-spacing:.12em; font-weight:600; margin:6px 0 2px; }
  .lead { font-size:12px; color:var(--sub); line-height:1.9; margin-bottom:14px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  label { display:block; font-size:11px; letter-spacing:.12em; color:var(--sub); margin-bottom:4px; }
  input, select, textarea { width:100%; background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:6px; color:var(--tx); font:inherit; font-size:14px; padding:9px 10px; }
  textarea { resize:vertical; min-height:52px; }
  .drop { border:2px dashed var(--line); border-radius:10px; padding:30px 14px; text-align:center; color:var(--sub); font-size:13px; cursor:pointer; transition:border-color .2s; }
  .drop.over { border-color:var(--gold); color:var(--gold); }
  .btn { display:inline-block; background:linear-gradient(180deg,#d4b571,#bd9a50); color:#171105; border:none; border-radius:6px; font:inherit; font-size:13.5px; font-weight:600; letter-spacing:.1em; padding:11px 20px; cursor:pointer; }
  .btn.line { background:none; border:1px solid var(--gold); color:var(--gold); font-weight:400; }
  .btn:disabled { opacity:.4; cursor:default; }
  .item { display:grid; grid-template-columns:88px 1fr; gap:12px; }
  .item .ph { width:88px; height:130px; border-radius:6px; overflow:hidden; background:#000; }
  .item .ph img { width:100%; height:100%; object-fit:cover; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .grid .w { grid-column:span 2; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .status { font-size:12px; color:var(--gold); min-height:18px; margin:4px 0; }
  .status.err { color:var(--red); }
  .tags { display:flex; gap:14px; align-items:center; padding:4px 0; }
  .tags label { display:flex; align-items:center; gap:5px; margin:0; font-size:12px; color:var(--tx); cursor:pointer; }
  .tags input { width:auto; }
  .notes { font-size:11px; color:var(--gold); margin-top:6px; line-height:1.7; }
  .rm { float:right; background:none; border:none; color:var(--sub); font-size:15px; cursor:pointer; padding:2px 6px; }
  .foot { font-size:11px; color:var(--sub); line-height:1.9; margin-top:10px; }
  details.keybox summary { font-size:12px; color:var(--sub); cursor:pointer; letter-spacing:.08em; }
  details.keybox .in { margin-top:10px; }
</style>
</head>
<body>

<h1>DROP 商品登録</h1>
<p class="lead">瓶の写真を選ぶと、AIがラベルを読んで商品情報を下書きします。価格と在庫数を入れて「ストアに登録」を押すだけ。</p>

<div class="card">
  <details class="keybox" id="keybox">
    <summary>スタッフPIN設定(最初に1回)</summary>
    <div class="in">
      <label for="key">PIN</label>
      <input id="key" type="password" placeholder="店長に確認してください" inputmode="numeric">
      <p class="foot">この端末に保存されます。APIキー等の秘密情報はこの画面には一切ありません。</p>
    </div>
  </details>
</div>

<div class="card">
  <div class="drop" id="drop">ここに瓶の写真をドロップ / タップして選択(複数可)</div>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <p class="status" id="status"></p>
</div>

<div id="list"></div>

<div class="card" id="exportcard" style="display:none;">
  <div class="tags" style="margin-bottom:10px;">
    <label><input type="checkbox" id="asdraft"> 下書きとして登録(棚に出さない)</label>
  </div>
  <div class="grid">
    <button class="btn" id="regall">ストアに登録</button>
    <button class="btn line" id="clear">全てクリア</button>
  </div>
  <p class="foot">
    登録すると写真・SPEC・在庫つきでストアの棚に即反映されます(下書き時は管理画面のみ)。<br>
    <a href="#" id="dl" style="color:var(--gold);">CSVでダウンロードしたい場合はこちら</a>
  </p>
</div>

<script>
'use strict';

const KEY_STORE = 'sobasay_staff_pin';
const $key = document.getElementById('key');
$key.value = localStorage.getItem(KEY_STORE) || '';
if (!$key.value) document.getElementById('keybox').open = true;
$key.addEventListener('change', () => localStorage.setItem(KEY_STORE, $key.value.trim()));

const items = []; // {img(dataURL縮小), data(schema結果), price, sku, qty, tags:{new,cold,sub}}
const $list = document.getElementById('list');
const $status = document.getElementById('status');
const $drop = document.getElementById('drop');
const $file = document.getElementById('file');

$drop.addEventListener('click', () => $file.click());
$drop.addEventListener('dragover', e => { e.preventDefault(); $drop.classList.add('over'); });
$drop.addEventListener('dragleave', () => $drop.classList.remove('over'));
$drop.addEventListener('drop', e => {
  e.preventDefault(); $drop.classList.remove('over');
  handleFiles([...e.dataTransfer.files]);
});
$file.addEventListener('change', () => { handleFiles([...$file.files]); $file.value = ''; });

function setStatus(msg, err) {
  $status.textContent = msg;
  $status.classList.toggle('err', !!err);
}

async function handleFiles(files) {
  const imgs = files.filter(f => f.type.startsWith('image/'));
  if (!imgs.length) return;
  if (!$key.value.trim()) {
    document.getElementById('keybox').open = true;
    setStatus('先にPINを設定してください', true);
    return;
  }
  for (let i = 0; i < imgs.length; i++) {
    setStatus(`読取中… ${i + 1} / ${imgs.length}`);
    try {
      const dataUrl = await resize(imgs[i], 1200);
      const b64 = dataUrl.split(',')[1];
      const data = await readLabel(b64);
      items.push({
        img: await resize(imgs[i], 400),
        b64,
        data,
        price: '', sku: '', qty: '10', done: false,
        tags: { new: true, cold: !!data.cold, sub: false }
      });
      render();
    } catch (err) {
      setStatus('読取失敗: ' + err.message, true);
      return;
    }
  }
  setStatus(`完了。内容を確認して修正してください(${items.length}件)`);
}

function resize(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const sc = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc);
      c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
    img.src = url;
  });
}

async function readLabel(b64) {
  const res = await fetch('/api/read', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ pin: $key.value.trim(), image: b64 })
  });
  const out = await res.json().catch(() => null);
  if (!res.ok) throw new Error(out?.error || `HTTP ${res.status}`);
  return out;
}

async function registerItem(i) {
  const it = items[i];
  if (!it.price || !it.data.name) throw new Error('商品名と価格を入れてください');
  const res = await fetch('/api/register', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      pin: $key.value.trim(),
      item: {
        name: it.data.name, kura: it.data.kura, region: it.data.region,
        category: it.data.category, volume: it.data.volume, type: it.data.type,
        spec: it.data.spec,
        price: it.price, sku: it.sku, qty: it.qty,
        tag_new: it.tags.new, tag_cold: it.tags.cold, tag_sub: it.tags.sub,
        draft: document.getElementById('asdraft').checked,
        image: it.b64
      }
    })
  });
  const out = await res.json().catch(() => null);
  if (!res.ok) throw new Error(out?.error || `HTTP ${res.status}`);
  it.done = true;
  return out;
}

function esc(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
}

function render() {
  $list.innerHTML = items.map((it, i) => `
  <div class="card item" data-i="${i}">
    <div><div class="ph"><img src="${it.img}" alt=""></div></div>
    <div>
      ${it.done ? '<span style="float:right;color:var(--gold);font-size:11px;letter-spacing:.1em;">✔ 登録済み</span>' : `<button class="rm" data-rm="${i}">✕</button>`}
      <div class="grid">
        <div class="w"><label>商品名</label><input data-f="name" value="${esc(it.data.name)}"></div>
        <div><label>蔵元(販売元)</label><input data-f="kura" value="${esc(it.data.kura)}"></div>
        <div><label>産地</label><input data-f="region" value="${esc(it.data.region)}"></div>
        <div><label>カテゴリ</label>
          <select data-f="category">
            ${['焼酎','日本酒','ビール','ワイン','その他'].map(c => `<option${c === it.data.category ? ' selected' : ''}>${c}</option>`).join('')}
          </select></div>
        <div><label>容量</label><input data-f="volume" value="${esc(it.data.volume)}"></div>
        <div class="w"><label>SPEC</label><textarea data-f="spec">${esc(it.data.spec)}</textarea></div>
      </div>
      <div class="grid3" style="margin-top:8px;">
        <div><label>価格(税込・円)</label><input data-f="price" inputmode="numeric" placeholder="3080" value="${esc(it.price)}"></div>
        <div><label>品番(SKU)</label><input data-f="sku" placeholder="SH-01" value="${esc(it.sku)}"></div>
        <div><label>在庫数</label><input data-f="qty" inputmode="numeric" value="${esc(it.qty)}"></div>
      </div>
      <div class="tags">
        <label><input type="checkbox" data-f="tag_new"${it.tags.new ? ' checked' : ''}> NEW</label>
        <label><input type="checkbox" data-f="tag_cold"${it.tags.cold ? ' checked' : ''}> ❄要冷蔵</label>
        <label><input type="checkbox" data-f="tag_sub"${it.tags.sub ? ' checked' : ''}> 予約</label>
      </div>
      ${it.data.notes ? `<p class="notes">⚠ ${esc(it.data.notes)}</p>` : ''}
    </div>
  </div>`).join('');
  document.getElementById('exportcard').style.display = items.length ? '' : 'none';
}

$list.addEventListener('input', e => {
  const card = e.target.closest('[data-i]');
  if (!card) return;
  const it = items[+card.dataset.i];
  const f = e.target.dataset.f;
  if (!f) return;
  if (f === 'price') it.price = e.target.value;
  else if (f === 'sku') it.sku = e.target.value;
  else if (f === 'qty') it.qty = e.target.value;
  else if (f === 'tag_new') it.tags.new = e.target.checked;
  else if (f === 'tag_cold') it.tags.cold = e.target.checked;
  else if (f === 'tag_sub') it.tags.sub = e.target.checked;
  else it.data[f] = e.target.value;
});

$list.addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) { items.splice(+rm.dataset.rm, 1); render(); }
});

document.getElementById('clear').addEventListener('click', () => {
  if (items.length && !confirm('入力内容を全て削除しますか?')) return;
  items.length = 0; render(); setStatus('');
});

function csvCell(v) {
  v = String(v ?? '');
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

document.getElementById('regall').addEventListener('click', async () => {
  const btn = document.getElementById('regall');
  btn.disabled = true;
  let okCount = 0;
  for (let i = 0; i < items.length; i++) {
    if (items[i].done) { okCount++; continue; }
    setStatus(`登録中… ${i + 1} / ${items.length}(${items[i].data.name})`);
    try {
      await registerItem(i);
      okCount++;
    } catch (err) {
      setStatus(`「${items[i].data.name}」の登録失敗: ${err.message}`, true);
      btn.disabled = false;
      render();
      return;
    }
  }
  setStatus(`完了: ${okCount}件をストアに登録しました`);
  btn.disabled = false;
  render();
});

document.getElementById('dl').addEventListener('click', (ev) => {
  if (ev) ev.preventDefault();
  const headers = [
    'Handle', 'Title', 'Body (HTML)', 'Vendor', 'Type', 'Tags', 'Published',
    'Option1 Name', 'Option1 Value',
    'Variant SKU', 'Variant Inventory Tracker', 'Variant Inventory Qty',
    'Variant Inventory Policy', 'Variant Fulfillment Service',
    'Variant Price', 'Variant Requires Shipping', 'Variant Taxable',
    'Status',
    '容量 (product.metafields.custom.volume)',
    '産地 (product.metafields.custom.region)',
    'SPEC (product.metafields.custom.spec)'
  ];
  const rows = items.map((it, i) => {
    const d = it.data;
    const handle = (it.sku || 'drop-item-' + (i + 1)).toLowerCase().replace(/[^a-z0-9]+/g, '-');
    const tags = [
      it.tags.new ? 'new' : '',
      it.tags.cold ? '要冷蔵' : '',
      it.tags.sub ? '予約' : ''
    ].filter(Boolean).join(', ');
    const body = [d.type, d.alc ? 'alc.' + d.alc.replace(/^alc\.?/i, '') : '']
      .filter(Boolean).join(' / ');
    return [
      handle, d.name, body, d.kura, d.type, tags, 'TRUE',
      'Title', 'Default Title',
      it.sku, 'shopify', it.qty || '0',
      'deny', 'manual',
      it.price || '0', 'TRUE', 'TRUE',
      'draft',
      d.volume, d.region, d.spec
    ].map(csvCell).join(',');
  });
  const csv = '﻿' + headers.join(',') + '\n' + rows.join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'drop_products.csv';
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
